spring.application.name=cinelog
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cinelog}
spring.datasource.username=${DB_USERNAME:cinelog}
spring.datasource.password=${DB_PASSWORD:cinelog_dev}
spring.jpa.hibernate.ddl-auto=validate

cinelog.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-at-least-32-chars}
cinelog.jwt.expiration=PT1H

server.port=${PORT:8080}

cinelog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}